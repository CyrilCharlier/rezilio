monolog:
    channels:
        - deprecation
        - security
        - security_rezilio

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]
            security:
                type: stream
                path: "%kernel.logs_dir%/security.log"
                level: info
                channels: ['security']
                formatter: monolog.formatter.json
            security_rezilio:
                type: stream
                path: "%kernel.logs_dir%/security_rezilio.log"
                level: info
                channels: ['security_rezilio']
                formatter: monolog.formatter.json

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
            security:
                type: stream
                path: '%kernel.logs_dir%/security.log'
                level: info
                channels: ['security']
                formatter: monolog.formatter.json
            security_rezilio:
                type: stream
                path: "%kernel.logs_dir%/security_rezilio.log"
                level: info
                channels: ['security_rezilio']
                formatter: monolog.formatter.json
