scheb_two_factor:
    security_tokens:
        - Symfony\Component\Security\Core\Authentication\Token\UsernamePasswordToken

    totp:
        enabled: true
        server_name: 'Rezilio'
        issuer: 'Rezilio'
        # leeway te permet de tolérer un léger décalage d’horloge si besoin
        leeway: 1
        parameters: { }
        template: 'security/2fa_form.html.twig'
