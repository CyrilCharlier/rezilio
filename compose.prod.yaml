services:
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    container_name: rezilio-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB}", "-U", "${POSTGRES_USER}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - rezilio_database_data:/var/lib/postgresql/data:rw
    networks:
      - rezilio_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rezilio-app
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./:/var/www/html
      - rezilio_vendor:/var/www/html/vendor
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - rezilio_net
      - caddy_net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: rezilio-pgadmin
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - rezilio_net
      - caddy_net

volumes:
  rezilio_database_data:
  rezilio_vendor:
  pgadmin_data:

networks:
  rezilio_net:
  caddy_net:
    external: true
